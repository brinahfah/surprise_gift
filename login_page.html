<body>

<section class="main">

    <div class="grand_titre">
       <h1>BIENVENUE SUR SURPRISE !</h1>
    </div>


    <div class="info">
        <form id="loginForm" onsubmit="return false;">
            <label for="name">NOM :</label>
            <input type="text" id="name" name="name" required placeholder="Saisir un nom">
            <br>

            <label for="username">PRÉNOM :</label>

            <br>

            <label for="date_birth">DATE DE NAISSANCE :</label>
            <input type="text" id="date_birth" name="date_birth" required placeholder="YYYY-MM-DD">
            <br>

            <button type="button" onclick="loginUser()">Se connecter</button>
            <div id="message" class="message" style="display: none;"></div>
        </form>
    </div>

    <a href="aide_user.html">Besoin d’aide ?</a>

    <div class="person">
        <img src="image/welcome.png" alt="personnage">
        <img src="image/welcome.png" alt="personnage">
        <img src="image/welcome.png" alt="personnage">
    </div>

    

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <script>

    document.addEventListener("DOMContentLoaded", function () {

    // =============================
    // INIT CALENDRIER
    // =============================

    flatpickr("#date_birth", {
        dateFormat: "Y-m-d",
        allowInput: true,
        disableMobile: true
    });

    new Cleave('#date_birth', {
        date: true,
        delimiter: '-',
        datePattern: ['Y', 'm', 'd']
    });

});


// =============================
// INIT SUPABASE (IMPORTANT)
// =============================

const supabaseUrl = 'https://orlwybmkqjqxoslrrwbq.supabase.co';
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ybHd5Ym1rcWpxeG9zbHJyd2JxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzkxODYyMDcsImV4cCI6MjA1NDc2MjIwN30.jrzvZvGLnRV_2ZVkvc24HvPImPpJK649xv46b4K_vKQ'; // ta vraie clé

// IMPORTANT : utiliser un nom différent
const supabaseClient = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);


// =============================
// MESSAGE
// =============================

const messageDiv = document.getElementById('message');

function logIncident(type, details) {

    console.log("INCIDENT :", {
        type: type,
        date: new Date().toISOString(),
        details: details
    });

}

function displayMessage(text, type) {

    messageDiv.textContent = text;
    messageDiv.className = "message " + type;
    messageDiv.style.display = "block";

}


// =============================
// LOGIN
// =============================

async function loginUser() {

    messageDiv.style.display = "none";

    const userName = document.getElementById('name').value.trim();
    const userFirstName = document.getElementById('username').value.trim();
    const birthDate = document.getElementById('date_birth').value.trim();

    console.log("Nom:", userName);
    console.log("Prenom:", userFirstName);
    console.log("Date:", birthDate);

    try {

        const { data, error } = await supabaseClient
            .from('users')
            .select('*')
            .eq('name', userName)
            .eq('username', userFirstName)
            .eq('date_birth', birthDate);

        console.log("DATA:", data);
        console.log("ERROR:", error);

        if (error) {

            logIncident("DATABASE_ERROR", error);

            displayMessage("Erreur connexion base", "error");
            return;

        }

        if (data && data.length > 0) {

            const user = data[0];

            await supabaseClient
                .from('login_stats')
                .insert([{ user_id: user.id_user }]);

            console.log("Connexion OK, redirection...");

            window.location.href = user.redirect_page || "surprise.html";

        } else {

            displayMessage("Identifiants incorrects", "error");

            
        }

    } catch (err) {

        console.error(err);
        displayMessage("Erreur inattendue", "error");

    }

}

</script>
